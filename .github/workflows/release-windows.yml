name: Windows desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64 app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package version v$version."
          }

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build the app and Windows installers
        run: npm run desktop:win

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem desktop-dist -File -Filter '*.exe') {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumPath = "$($file.FullName).sha256"
            [System.IO.File]::WriteAllText($checksumPath, "$hash  $($file.Name)`n", [System.Text.Encoding]::ASCII)
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDFmaster-Windows-x64
          path: |
            desktop-dist/PDFmaster-Setup.exe
            desktop-dist/PDFmaster-Setup.exe.sha256
            desktop-dist/PDFmaster-Portable.exe
            desktop-dist/PDFmaster-Portable.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop-dist/PDFmaster-Setup.exe
            desktop-dist/PDFmaster-Setup.exe.sha256
            desktop-dist/PDFmaster-Portable.exe
            desktop-dist/PDFmaster-Portable.exe.sha256
