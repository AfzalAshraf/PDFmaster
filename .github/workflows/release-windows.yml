name: Windows desktop release

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths:
      - 'package.json'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64 app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release tag
        id: release-tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version") {
              throw "Tag $tag must match package version v$version."
            }
            $shouldPublish = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $tag = "v$version"
            $existingTag = (git ls-remote --refs origin "refs/tags/$tag" | Out-String).Trim()
            $shouldPublish = if ([string]::IsNullOrWhiteSpace($existingTag)) { 'true' } else { 'false' }
          } else {
            $tag = "v$version"
            $shouldPublish = 'false'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_publish=$shouldPublish" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag (publish=$shouldPublish)"

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build the app and Windows installers
        run: npm run desktop:win

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem desktop-dist -File -Filter '*.exe') {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumPath = "$($file.FullName).sha256"
            [System.IO.File]::WriteAllText($checksumPath, "$hash  $($file.Name)`n", [System.Text.Encoding]::ASCII)
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDFmaster-Windows-x64
          path: |
            desktop-dist/PDFmaster-Setup.exe
            desktop-dist/PDFmaster-Setup.exe.sha256
            desktop-dist/PDFmaster-Portable.exe
            desktop-dist/PDFmaster-Portable.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: steps.release-tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            desktop-dist/PDFmaster-Setup.exe
            desktop-dist/PDFmaster-Setup.exe.sha256
            desktop-dist/PDFmaster-Portable.exe
            desktop-dist/PDFmaster-Portable.exe.sha256
