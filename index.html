<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#202124" />
    <meta
      name="description"
      content="PDFmaster — local-first PDF editor for browser and Windows desktop. Annotate, edit, sign, protect, OCR, organize and convert PDFs without uploading files."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PDFmaster — PDF Editor</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #16171a;
        color: #dcdde1;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overscroll-behavior: none;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        background: #16171a;
        z-index: 100;
        transition: opacity 0.25s ease;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-mark {
        width: 54px;
        height: 54px;
        border-radius: 13px;
        background: linear-gradient(140deg, #ff6155, #d92c1f);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        font-size: 20px;
        letter-spacing: 0.5px;
        box-shadow: 0 10px 30px rgba(217, 44, 31, 0.35);
      }
      .boot-bar {
        width: 190px;
        height: 3px;
        border-radius: 3px;
        background: #2c2d32;
        overflow: hidden;
      }
      .boot-bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #ff4a3d, #ff8a7a);
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-mark">PDF</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
